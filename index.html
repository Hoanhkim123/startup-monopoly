<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Startup Monopoly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: booth screen — Monopoly ring board (4x4) on the left, founder's dashboard + live card on the right; stacks on phones.
   Single deliberate look (RISE "shopfront" world: sunburst cream, navy ink, orange coin) — colors set explicitly for both host themes. */
:root{
  --ink:#1c1f3f;          /* navy outline ink */
  --paper:#fff6e2;        /* cream card */
  --sun:#fcd58a;          /* sunburst base */
  --sun-deep:#f9c165;
  --coin:#f47b20;         /* RISE orange */
  --mint:#3fb58f;         /* awning teal */
  --berry:#d8452f;        /* risk red */
  --sky:#2f5bea;          /* product blue */
  --muted:#6a6377;
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --body:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;font-family:var(--body);color:var(--ink);font-size:15px;line-height:1.45;
  background:
    radial-gradient(circle,rgba(244,123,32,.16) 1.3px,transparent 1.8px) 0 0/16px 16px,
    repeating-conic-gradient(from 0deg at 50% 30%,rgba(255,255,255,.28) 0 6deg,transparent 6deg 14deg),
    radial-gradient(circle at 50% 30%,#ffe7b3,var(--sun-deep) 80%);
  background-color:var(--sun);
  background-attachment:fixed;
}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,4.4vw,48px);line-height:1;margin:0;letter-spacing:.5px;
  color:var(--paper);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
.brand h1 b{color:var(--coin);font-weight:400}
.tag{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;background:var(--ink);color:var(--sun);padding:4px 10px;border-radius:999px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* main grid */
.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}

/* board */
.board{position:relative;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px;
  aspect-ratio:1/1;max-width:100%;background:var(--ink);padding:8px;border-radius:22px;box-shadow:8px 8px 0 rgba(28,31,63,.35)}
.cell{position:relative;background:var(--paper);border-radius:12px;padding:8px 9px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;overflow:hidden}
.cell .stripe{position:absolute;inset:0 0 auto 0;height:9px}
.cell .num{font-size:11px;font-weight:700;color:var(--muted);margin-top:8px}
.cell .nm{font-family:var(--display);font-size:clamp(13px,1.7vw,20px);line-height:1.05;letter-spacing:.3px}
.cell .sub{font-size:clamp(9px,1vw,11px);color:var(--muted);font-weight:600;line-height:1.2}
.cell.corner{background:var(--coin);color:var(--paper)}
.cell.corner .num,.cell.corner .sub{color:#fff3dc}
.cell.corner.risk{background:var(--berry)}
.cell.corner.pitch{background:var(--sky)}
.cell.corner.start{background:var(--mint)}
.cell.hit{animation:hit .6s ease}
@keyframes hit{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.center{grid-column:2/4;grid-row:2/4;background:
  repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.35) 0 7deg,transparent 7deg 15deg),var(--sun);
  border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;text-align:center}
.dice{width:clamp(64px,10vw,96px);aspect-ratio:1;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:12%}
.dice i{width:62%;aspect-ratio:1;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.dice i.on{visibility:visible}
.dice.roll{animation:shake .5s linear infinite}
@keyframes shake{0%{transform:rotate(0)}25%{transform:rotate(14deg)}50%{transform:rotate(-10deg)}75%{transform:rotate(8deg)}100%{transform:rotate(0)}}
.rollbtn{font-family:var(--display);font-size:clamp(18px,2.2vw,24px);letter-spacing:1px;background:var(--coin);color:var(--paper);border:3px solid var(--ink);
  border-radius:14px;padding:8px 22px;box-shadow:4px 4px 0 var(--ink)}
.rollbtn:disabled{opacity:.45;cursor:not-allowed}
.rollbtn:not(:disabled):active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.rolls{display:flex;gap:6px}
.rolls span{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--paper)}
.rolls span.used{background:var(--ink)}
.center small{font-weight:700;font-size:12px}

/* token */
.token{position:absolute;width:clamp(26px,3.6vw,38px);aspect-ratio:1;border-radius:50%;background:var(--coin);border:3px solid var(--ink);
  box-shadow:2px 3px 0 var(--ink);display:grid;place-items:center;font-family:var(--display);color:var(--paper);font-size:clamp(12px,1.6vw,17px);
  transition:left .22s ease,top .22s ease;z-index:3;pointer-events:none}
.token::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1.5px dashed rgba(255,246,226,.8)}

/* side panel */
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:16px 18px}
.dash{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.meters{display:flex;flex-direction:column;gap:9px;min-width:0}
.meter .row{display:flex;justify-content:space-between;font-weight:700;font-size:13px}
.meter .row span:last-child{font-variant-numeric:tabular-nums}
.bar{height:14px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.bar b{display:block;height:100%;border-radius:999px;transition:width .5s ease}
.delta{font-size:12px;font-weight:800;margin-left:6px}
.delta.up{color:#178a62}.delta.down{color:var(--berry)}
.coinbox{text-align:center}
.bigcoin{width:92px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd87a,#f9a83a 60%,#e8811c);border:4px solid var(--ink);
  box-shadow:3px 4px 0 var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:38px;color:var(--ink);position:relative}
.bigcoin::after{content:"";position:absolute;inset:7px;border-radius:50%;border:2px dotted var(--ink);opacity:.5}
.bigcoin.pop{animation:hit .5s ease}
.coinbox small{display:block;margin-top:6px;font-weight:800;font-size:11px;letter-spacing:1.2px;text-transform:uppercase}
.hint{font-size:12px;color:var(--muted);margin:10px 0 0}

/* card */
.card{position:relative;overflow:hidden}
.card .kicker{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--paper);padding:3px 10px;border-radius:999px;margin-bottom:8px}
.card h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.4vw,28px);line-height:1.15;margin:0 0 8px;text-wrap:balance;letter-spacing:.2px}
.card p{margin:0 0 10px}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px;
  font-size:15px;font-weight:600;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.opt:hover{background:#fff1d6}
.opt .k{font-family:var(--display);font-size:22px;width:38px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper)}
.opt.chosen{background:#ffe2c4;box-shadow:inset 0 0 0 2px var(--coin),3px 3px 0 var(--ink)}
.opt:disabled{cursor:default}
.opt:disabled:not(.chosen){opacity:.45}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn{border:2.5px solid var(--ink);border-radius:12px;padding:9px 16px;font-weight:800;font-size:14px;background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.orange{background:var(--coin);color:var(--paper)}
.callout{border:2px dashed var(--ink);border-radius:12px;padding:10px 12px;background:#fffdf6;margin-top:10px;font-size:14px}
.callout b{display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:3px}
.effects{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.eff{font-weight:800;font-size:13px;border-radius:999px;padding:3px 10px;border:2px solid var(--ink);background:#fff}
.eff.up{background:#d9f3e8}.eff.down{background:#fbe0da}
.quote{font-size:16px;font-weight:600;border-left:5px solid var(--coin);padding:4px 0 4px 12px;margin:6px 0 14px}
.namein{display:flex;gap:8px;flex-wrap:wrap}
.namein input{flex:1 1 180px;min-width:0;border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-weight:600;background:#fff;color:var(--ink)}
.rules{margin:12px 0 0;padding-left:18px;font-size:14px}
.rules li{margin:3px 0}

/* end screen */
.score{display:grid;gap:6px;margin:8px 0 12px}
.score div{display:flex;justify-content:space-between;border-bottom:1.5px dotted rgba(28,31,63,.3);padding:4px 0;font-weight:600}
.score div span:last-child{font-variant-numeric:tabular-nums;font-weight:800}
.score .total{border-bottom:none;font-family:var(--display);font-size:22px;font-weight:400}
.prize{background:var(--ink);color:var(--paper);border-radius:14px;padding:14px 16px;margin-top:6px}
.prize small{display:block;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--sun)}
.prize strong{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.4px}

/* leaderboard + settings */
.lb ol{margin:6px 0 0;padding-left:0;list-style:none}
.lb li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-weight:600}
.lb li span:last-child{font-variant-numeric:tabular-nums;font-weight:800}
.lb h3,.set h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0;letter-spacing:.3px}
.set .tier{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;margin-top:8px;align-items:center}
.set input{border:2px solid var(--ink);border-radius:10px;padding:7px 9px;font:inherit;background:#fff;color:var(--ink);min-width:0}
.log{font-size:13px;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Startup <b>Monopoly</b></h1>
      <span class="tag" id="tagline">RISE Experience Day</span>
    </div>
    <div class="toolbar">
      <button class="chip" id="langVi" aria-pressed="true">Tiếng Việt</button>
      <button class="chip" id="langEn" aria-pressed="false">English</button>
      <button class="chip" id="newBtn">Người chơi mới</button>
    </div>
  </header>

  <div class="main">
    <section aria-label="Board">
      <div class="board" id="board">
        <div class="center">
          <div class="dice" id="dice" aria-live="polite"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <button class="rollbtn" id="rollBtn">Gieo xúc xắc</button>
          <div class="rolls" id="rolls" aria-label="Rolls left"><span></span><span></span><span></span></div>
          <small id="rollInfo">Còn 3 lượt gieo</small>
        </div>
        <div class="token" id="token" aria-hidden="true">R</div>
      </div>
    </section>

    <aside class="side">
      <div class="panel dash">
        <div class="meters" id="meters"></div>
        <div class="coinbox">
          <div class="bigcoin" id="coinNum">0</div>
          <small id="coinLbl">Startup Coins</small>
        </div>
      </div>
      <div class="panel card" id="card"></div>
      <div class="panel lb" id="leader"></div>
    </aside>
  </div>
</div>

/* ---------- state ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang=store.get("sm_lang","vi");
let st;
function fresh(name){return{name:name||"",pos:0,rolls:3,stats:[50,50,50],coins:0,parts:{scen:0,reason:0,events:0},used:[],phase:"intro",busy:false}}
st=fresh();
st.phase="intro";

const $=id=>document.getElementById(id);
const T=()=>UI[lang];
const L=o=>o[lang]||o.vi;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ---------- board ---------- */
const boardEl=$("board");
function buildBoard(){
  boardEl.querySelectorAll(".cell").forEach(n=>n.remove());
  BOARD.forEach((k,i)=>{
    const c=CAT[k],[r,col]=POS[i];
    const d=document.createElement("div");
    d.className="cell"+(k in CORNER?" corner "+CORNER[k]:"");
    d.style.gridRow=r+1;d.style.gridColumn=col+1;d.dataset.i=i;
    const sub=k in CORNER?(lang==="vi"?c.subVi:c.subEn):(lang==="vi"?"Tình huống":"Scenario");
    d.innerHTML=(k in CORNER?"":`<span class="stripe" style="background:${c.color}"></span>`)+
      `<span class="num">${String(i).padStart(2,"0")}</span><span class="nm">${esc(L(c))}</span><span class="sub">${esc(sub)}</span>`;
    boardEl.insertBefore(d,boardEl.querySelector(".center"));
  });
  placeToken();
}
function placeToken(){
  const cell=boardEl.querySelector(`.cell[data-i="${st.pos}"]`);if(!cell)return;
  const tk=$("token");
  tk.style.left=(cell.offsetLeft+cell.offsetWidth-tk.offsetWidth-8)+"px";
  tk.style.top=(cell.offsetTop+8)+"px";
}
window.addEventListener("resize",placeToken);

/* ---------- dice ---------- */
const FACES={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function showFace(n){[...$("dice").children].forEach((p,i)=>p.classList.toggle("on",FACES[n].includes(i)));$("dice").setAttribute("aria-label",String(n))}
showFace(1);

/* ---------- stats ---------- */
const COLORS=["var(--coin)","var(--mint)","var(--sky)"];
function renderMeters(deltas){
  const names=[T().cust,T().cash,T().rep];
  $("meters").innerHTML=st.stats.map((v,i)=>{
    const d=deltas&&deltas[i]?`<span class="delta ${deltas[i]>0?"up":"down"}">${deltas[i]>0?"+":""}${deltas[i]}</span>`:"";
    return `<div class="meter"><div class="row"><span>${names[i]}${d}</span><span>${v}/100</span></div><div class="bar"><b style="width:${v}%;background:${COLORS[i]}"></b></div></div>`;
  }).join("");
}
function applyEff(e){const d=e.map((x,i)=>{const nv=Math.max(0,Math.min(100,st.stats[i]+x));const real=nv-st.stats[i];st.stats[i]=nv;return real});renderMeters(d);return d}
function addCoins(n,key){if(!n)return;st.coins+=n;if(key)st.parts[key]+=n;const c=$("coinNum");c.textContent=st.coins;c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop")}
function effChips(e){const names=[T().cust,T().cash,T().rep];return `<div class="effects">${e.map((x,i)=>x?`<span class="eff ${x>0?"up":"down"}">${names[i]} ${x>0?"+":""}${x}</span>`:"").join("")}</div>`}

/* ---------- roll + move ---------- */
function renderRolls(){
  [...$("rolls").children].forEach((s,i)=>s.classList.toggle("used",i>=st.rolls));
  $("rollInfo").textContent=st.rolls>0?T().left(st.rolls):T().done;
  $("rollBtn").textContent=T().roll;
  $("rollBtn").disabled=st.busy||st.phase!=="roll"||st.rolls<=0;
}
$("rollBtn").addEventListener("click",()=>{
  if(st.busy||st.phase!=="roll"||st.rolls<=0)return;
  st.busy=true;renderRolls();
  const dice=$("dice");dice.classList.add("roll");
  let t=0;const iv=setInterval(()=>{showFace(1+Math.floor(Math.random()*6));t++;},80);
  setTimeout(()=>{
    clearInterval(iv);dice.classList.remove("roll");
    const n=1+Math.floor(Math.random()*6);showFace(n);
    st.rolls--;renderRolls();move(n);
  },700);
});
function move(n){
  let k=0,passed=false;
  const step=()=>{
    st.pos=(st.pos+1)%BOARD.length;if(st.pos===0)passed=true;placeToken();k++;
    if(k<n)setTimeout(step,230);
    else{
      const cell=boardEl.querySelector(`.cell[data-i="${st.pos}"]`);cell.classList.remove("hit");void cell.offsetWidth;cell.classList.add("hit");
      if(passed){applyEff([0,10,0]);addCoins(1,"events")}
      setTimeout(()=>land(passed),280);
    }
  };
  setTimeout(step,150);
}
function land(passed){
  st.busy=false;
  const k=BOARD[st.pos];
  const pre=passed?`<div class="callout"><b>${lang==="vi"?"Khởi nghiệp":"Start"}</b>${T().passStart}</div>`:"";
  if(k==="opp"||k==="risk"){
    const deck=k==="opp"?OPP:RISK;const cd=deck[Math.floor(Math.random()*deck.length)];
    st.phase="event";
    const d=applyEff(cd.e);if(cd.coin)addCoins(cd.coin,"events");
    card(`<span class="kicker" style="background:${k==="opp"?"var(--coin)":"var(--berry)"}">${k==="opp"?T().kickO:T().kickR}</span>
      <h2>${esc(L(cd))}</h2>${effChips(d)}${cd.coin?`<div class="effects"><span class="eff up">${T().earned(cd.coin)}</span></div>`:""}
      <div class="callout"><b>${T().lesson}</b>${esc(L(cd.l))}</div>${pre}
      <div class="actions"><button class="btn primary" id="nextBtn">${T().cont}</button></div>`);
    $("nextBtn").onclick=next;$("nextBtn").focus();
    return;
  }
  if(k==="start"){st.phase="event";card(`<span class="kicker" style="background:var(--mint)">${esc(L(CAT.start))}</span><h2>${T().passStart}</h2><div class="actions"><button class="btn primary" id="nextBtn">${T().cont}</button></div>`);$("nextBtn").onclick=next;$("nextBtn").focus();return}
  // scenario
  let pool=S.map((s,i)=>i).filter(i=>S[i].c===k&&!st.used.includes(i));
  if(!pool.length)pool=S.map((s,i)=>i).filter(i=>!st.used.includes(i));
  const idx=pool[Math.floor(Math.random()*pool.length)];st.used.push(idx);
  st.phase="choose";st.cur=idx;
  renderScenario(pre);
}
function renderScenario(pre){
  const s=S[st.cur],c=CAT[s.c];
  card(`<span class="kicker" style="background:${c.color}">${T().kickS} · ${esc(L(c))}</span>
    <h2>${esc(L(s))}</h2>
    <div class="opts">
      <button class="opt" data-k="A"><span class="k">A</span><span>${esc(L(s.A))}</span></button>
      <button class="opt" data-k="B"><span class="k">B</span><span>${esc(L(s.B))}</span></button>
    </div><div id="after"></div>${pre||""}`);
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(b.dataset.k));
}
function choose(key){
  if(st.phase!=="choose")return;st.phase="reason";
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.k===key)b.classList.add("chosen")});
  st.choice=key;
  $("after").innerHTML=`<div class="callout"><b>${T().why}</b></div>
    <div class="actions"><button class="btn orange" id="expBtn">${T().explained}</button><button class="btn" id="hintBtn">${T().showHint}</button></div><div id="hintBox"></div>`;
  $("expBtn").onclick=()=>resolve(true);
  $("hintBtn").onclick=()=>{const o=S[st.cur][key];$("hintBox").innerHTML=`<div class="callout"><b>${T().adv}</b>${esc(L(o.adv))}</div>`;$("hintBtn").remove();
    const a=document.querySelector("#after .actions");const b=document.createElement("button");b.className="btn primary";b.textContent=T().cont;b.onclick=()=>resolve(false);a.appendChild(b)};
}
function resolve(explained){
  if(st.phase!=="reason")return;st.phase="event";
  const o=S[st.cur][st.choice];
  const d=applyEff(o.e);
  addCoins(2,"scen");if(explained)addCoins(1,"reason");
  const got=2+(explained?1:0);
  $("after").innerHTML=`<div class="callout"><b>${T().result}</b>${esc(L(o.adv))}</div>${effChips(d)}
    <div class="effects"><span class="eff up">${T().earned(got)}</span></div>
    <div class="actions"><button class="btn primary" id="nextBtn">${T().cont}</button></div>`;
  $("nextBtn").onclick=next;$("nextBtn").focus();
}
function next(){
  if(st.rolls>0){st.phase="roll";rollCard();renderRolls();$("rollBtn").focus()}
  else finish();
}

/* ---------- cards ---------- */
function card(html){$("card").innerHTML=html}
function introCard(){
  st.phase="intro";
  card(`<span class="kicker" style="background:var(--ink)">${lang==="vi"?"Luật chơi":"How to play"}</span>
    <h2>${T().welcome}</h2>
    <p class="quote">${T().intro}</p>
    <form class="namein" id="nameForm"><label for="nameIn" class="sr" hidden>name</label>
      <input id="nameIn" maxlength="28" placeholder="${T().namePh}" value="${esc(st.name)}">
      <button class="btn orange" type="submit">${T().start}</button></form>
    <ul class="rules">${T().rules.map(r=>`<li>${r}</li>`).join("")}</ul>`);
  $("nameForm").addEventListener("submit",e=>{e.preventDefault();st.name=$("nameIn").value.trim();st.phase="roll";rollCard();renderRolls();$("rollBtn").focus()});
  renderRolls();
}
function rollCard(){
  card(`<span class="kicker" style="background:var(--ink)">${st.name?esc(st.name):T().coins}</span>
    <h2>${T().rollPrompt}</h2><p>${T().rollHint}</p>
    <ul class="rules">${T().rules.slice(1,3).map(r=>`<li>${r}</li>`).join("")}</ul>`);
}
function balanceBonus(){const m=Math.min(...st.stats);return m>=60?4:m>=40?2:m>=25?1:0}
function message(){
  const v=st.stats,mn=Math.min(...v),mx=Math.max(...v);
  const lo=v.indexOf(mn),hi=v.indexOf(mx);
  if(mn>=60&&mx-mn<=25)return `<p class="quote">${T().balHead}</p><p>${T().balBody}</p>`;
  if(mn>=40&&mx-mn<=20)return `<p class="quote">${T().okHead}</p><p>${T().okBody}</p>`;
  const names=[T().cust,T().cash,T().rep];
  const lowLine=lang==="vi"?`${names[lo]} đang là điểm yếu (${mn}/100).`:`${names[lo]} is your weak spot (${mn}/100).`;
  return `<p class="quote">${mx-mn>=15?T().strong[hi]+" ("+mx+"/100), "+T().but+" "+lowLine.charAt(0).toLowerCase()+lowLine.slice(1):lowLine}</p>
    <p>${T().low[lo]}</p><div class="callout">${T().closing}</div>`;
}
function finish(){
  st.phase="end";renderRolls();
  const b=balanceBonus();addCoins(b,null);
  const lb=store.get("sm_lb",[]);lb.push({n:st.name||"",c:st.coins,t:Date.now()});lb.sort((a,b)=>b.c-a.c||a.t-b.t);store.set("sm_lb",lb.slice(0,50));
  card(`<span class="kicker" style="background:var(--coin)">${st.name?esc(st.name):T().coins}</span>
    <h2>${T().msgTitle}</h2>
    ${message()}
    <div class="prize"><small>${T().total}</small><strong>${st.coins} Startup Coins</strong></div>
    <div class="actions"><button class="btn primary" id="againBtn">${T().again}</button></div>`);
  $("againBtn").onclick=reset;$("againBtn").focus();
  renderLeader();
}
function reset(){st=fresh();$("coinNum").textContent="0";renderMeters();placeToken();showFace(1);introCard()}

/* ---------- leaderboard + settings ---------- */
function renderLeader(){
  const lb=store.get("sm_lb",[]);
  const today=new Date().toDateString();
  const rows=lb.filter(r=>new Date(r.t).toDateString()===today).slice(0,5);
  $("leader").innerHTML=`<h3>${T().lb}</h3>`+(rows.length?`<ol>${rows.map((r,i)=>`<li><span>${i+1}. ${esc(r.n||T().anon)}</span><span>${r.c} coins</span></li>`).join("")}</ol>`:`<p class="log">${T().lbEmpty}</p>`);
}
$("newBtn").onclick=reset;

/* ---------- language ---------- */
function setLang(l){
  lang=l;store.set("sm_lang",l);
  $("langVi").setAttribute("aria-pressed",String(l==="vi"));$("langEn").setAttribute("aria-pressed",String(l==="en"));
  $("newBtn").textContent=T().newp;$("coinLbl").textContent=T().coins;
  document.documentElement.lang=l;
  buildBoard();renderMeters();renderRolls();renderLeader();
  if(st.phase==="intro")introCard();else if(st.phase==="roll")rollCard();else if(st.phase==="choose")renderScenario();else if(st.phase==="end"){/* keep */}
}
$("langVi").onclick=()=>setLang("vi");$("langEn").onclick=()=>setLang("en");

/* ---------- boot ---------- */
setLang(lang);
introCard();
requestAnimationFrame(placeToken);
document.fonts&&document.fonts.ready.then(placeToken);
})();
</script>
</body>
</html>
